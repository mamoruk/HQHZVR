<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>虹桥和著一期 - 毛坯结构VR存档</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: #f5f7fa;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* 标题样式 */
        .title {
            text-align: center;
            margin: 40px 0 30px;
            color: #2c3e50;
            line-height: 1.6;
        }

        .title h1 {
            font-size: 26px;
            margin-bottom: 8px;
            color: #2d3748;
        }

        .title p {
            font-size: 16px;
            color: #718096;
        }

        /* 按钮网格 */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        /* 按钮样式 */
        .btn {
            display: block;
            background: #4299e1;
            color: white;
            text-align: center;
            padding: 22px 16px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(66, 153, 225, 0.2);
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: #3182ce;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* 不同户型颜色区分 */
        .btn-94 { background: #48bb78; }
        .btn-104 { background: #ed8936; }
        .btn-128 { background: #9f7aea; }
    </style>
</head>

<body>
    <div class="container">
        <div class="title">
            <h1>虹桥和著一期</h1>
            <p>毛坯结构VR全景存档</p>
        </div>

        <div class="grid">
            <a href="94a.html" class="btn btn-94">94边套 户型VR</a>
            <a href="94b.html" class="btn btn-94">94中间套 户型VR</a>
            <a href="104a.html" class="btn btn-104">104边套 户型VR</a>
            <a href="104b.html" class="btn btn-104">104中间套 户型VR</a>
            <a href="128a.html" class="btn btn-128">128边套 户型VR</a>
            <a href="128b.html" class="btn btn-128">128中间套 户型VR</a>
        </div>
    </div>
</body>
</html>
